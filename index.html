<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <!-- Audio Element -->
    <audio id="background-music" loop>
      <source src="background-music.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Music Controls -->
    <div id="music-controls">
      <button id="music-toggle" class="music-btn" title="Play/Pause Music">
        <span class="music-icon">🎵</span>
      </button>
      <div id="volume-controls" class="volume-controls">
        <button id="mute-btn" class="control-btn" title="Mute/Unmute">🔊</button>
        <input type="range" id="volume-slider" min="0" max="100" value="70" class="volume-slider">
      </div>
    </div>

    <!-- Bloom Intro Animation -->
    <div id="bloom-intro-container">
      <div id="pixel-pot">
        <div class="pot-rim"></div>
        <div class="pot-body"></div>
      </div>
      <div id="pixel-stem"></div>
      <div id="pixel-bud">
        <div class="bud-center"></div>
        <div class="bud-petal bud-petal-1"></div>
        <div class="bud-petal bud-petal-2"></div>
        <div class="bud-petal bud-petal-3"></div>
        <div class="bud-petal bud-petal-4"></div>
      </div>
    </div>

    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>♡ Letter for Ms.Chan ♡</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Hi Ms. Chan, will you be my Valentine?</h1>

        <img src="cat_heart.gif" class="cat" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <p id="final-text" class="final-text" style="display: none">
          <strong>Valentine Date:</strong> The Grayson at 6:45pm. Dress fancy!
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
